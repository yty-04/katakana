<h1>カタカナ ひょう</h1>
<div id="novoice">

</div>

</div>

    <div class="bigrow" id="bigrow"></div>
  </div>
  <button class="sound" id="soundBtn">🔊 おと オン</button>
</div>
<div class="panel" id="p-game">

    <button class="mode on" id="modeQuiz"><span class="micon">🚂</span>もんだい</button>
    <button class="mode" id="modePractice"><span class="micon">✏️</span>れんしゅう</button>
  </div>

    <div class="score">⭐ <span id="score">0</span></div>
    <div class="streak" id="streak">・・・・・</div>
    <button class="sound" id="soundBtn2">🔊 おと オン</button>

  </div>

    </div>

    <div class="prompt" id="prompt">じゅんばんに おしてね</div>

  <div class="choices" id="choices"></div>
  <div class="toast" id="toast">がんばって！</div>
</div>

    </div>
    <div class="stamps" id="stamps"></div>
    <div class="booknext" id="bookNext"></div>
  </div>
  <div class="bookcard" id="doneWrap">

    <button class="resetbtn" id="resetBtn">スタンプを ぜんぶ けす（おとなのひと）</button>
  </div>
</div>
<div id="printArea"></div>
<div id="celebrate"></div>
<div id="welcome">

    <div class="wsub" id="wSub"></div>
    <button class="menubtn go" id="wGo">▶ はじめる</button>
  </div>
</div>
<script>

u: [350, 1200, 2200],

"マ":["m","a"],"ミ":["m","i"],"ム":["m","u"],"メ":["m","e"],"モ":["m","o"],
"ヤ":["y","a"],              "ユ":["y","u"],              "ヨ":["y","o"],
"ラ":["r","a"],"リ":["r","i"],"ル":["r","u"],"レ":["r","e"],"ロ":["r","o"],
"ワ":["w","a"],"ヲ":["","o"], "ン":["N",""],
"ガ":["g","a"],"ギ":["g","i"],"グ":["g","u"],"ゲ":["g","e"],"ゴ":["g","o"],
"ザ":["z","a"],"ジ":["j","i"],"ズ":["z","u"],"ゼ":["z","e"],"ゾ":["z","o"],

"バ":["b","a"],"ビ":["b","i"],"ブ":["b","u"],"ベ":["b","e"],"ボ":["b","o"],

k:  { type:"stop",  dur:0.045, noise:2500, gain:0.30 },
g:  { type:"stop",  dur:0.035, noise:1500, gain:0.22, voiced:true },
t:  { type:"stop",  dur:0.035, noise:3500, gain:0.30 },
d:  { type:"stop",  dur:0.030, noise:1800, gain:0.22, voiced:true },
p:  { type:"stop",  dur:0.035, noise:1200, gain:0.26 },

s:  { type:"fric",  dur:0.10,  noise:5500, gain:0.16 },

j:  { type:"fric",  dur:0.07,  noise:2600, gain:0.15, voiced:true },
h:  { type:"fric",  dur:0.07,  noise:1800, gain:0.10 },
f:  { type:"fric",  dur:0.08,  noise:1400, gain:0.11 },
ch: { type:"stop",  dur:0.055, noise:3000, gain:0.26 },
ts: { type:"stop",  dur:0.055, noise:4500, gain:0.26 },
n:  { type:"nasal", dur:0.06,  gain:0.20 },
m:  { type:"nasal", dur:0.06,  gain:0.20 },
N:  { type:"nasal", dur:0.13,  gain:0.20 },

function synthKana(a, out, kana, t, opt) {
opt = opt || {};
var m = KANA_MAP[kana];
if (!m) return 0;
var cName = m[0], v = m[1];
var pitch = opt.pitch || 200;
var vLen  = opt.len   || 0.19;

vg.gain.linearRampToValueAtTime(0.9, t + 0.03);

bq.frequency.value = F[k];
bq.Q.value = Qs[k];

fg.gain.value = amps[k];

osc.stop(t + vLen + 0.03);

var a = audio();

out.connect(master(a));
var t = a.currentTime + (delay || 0) + 0.02;

function master(a){
if(!masterGain){
masterGain = a.createGain();
masterGain.gain.value = VOLUME;
masterGain.connect(a.destination);

}

if(!actx){

}

if(m[0] === bgmStep){
bgmNote(a, m[1], bgmNext, m[2] * BGM_STEP + 0.35, 0.5, "sine");
bgmNote(a, m[1] + 12, bgmNext, 0.25, 0.12, "sine");

for(var j = 0; j < BGM_BASS.length; j++){
if(BGM_BASS[j][0] === bgmStep) bgmNote(a, BGM_BASS[j][1], bgmNext, 4 * BGM_STEP, 0.35, "triangle");

return Math.random() < RARE_RATE;
}
function newSlots(){
var all = [];
for(var i = 0; i < STAMPS.length; i++) all.push(i);
for(var i = all.length - 1; i > 0; i--){
var j = Math.floor(Math.random() * (i + 1));
var t = all[i]; all[i] = all[j]; all[j] = t;
}
return all.slice(0, PER_CARD);
}
function slotStamp(i){
return STAMPS[slots[i]] || STAMPS[0];
}
function stampHTML(st){
if(!st) return "";
if(st.e) return st.e;
return '<span class="tr" style="background:' + st.c1 + ';border-color:' + st.c2 + '">' +
'<span class="trw" style="background:' + st.c2 + '"></span>' +
'<span class="trb">' + st.b + '</span>' +
'</span>';
}
var recent = [];
var cards = [];
var cardDone = 0;
function loadStamps(){
try{
var v = window.localStorage.getItem("katakana_stamps");
stampCount = v ? parseInt(v, 10) : 0;
if(isNaN(stampCount) || stampCount < 0) stampCount = 0;
}catch(e){ stampCount = 0; }
try{
var c = window.localStorage.getItem("katakana_cards");
cards = c ? JSON.parse(c) : [];
if(!isCardList(cards)) cards = [];
}catch(e){ cards = []; }
try{
var sl = window.localStorage.getItem("katakana_slots");
slots = sl ? JSON.parse(sl) : [];
if(!slots || slots.length !== PER_CARD) slots = newSlots();
}catch(e){ slots = newSlots(); }
if(padCards()) saveStamps();
}
function padCards(){
var should = Math.floor(stampCount / PER_CARD);
if(cards.length >= should) return false;
var d = new Date();
while(cards.length < should){
cards.push({
n: cards.length + 1,
date: d.getFullYear() + "ねん " + (d.getMonth() + 1) + "がつ " + d.getDate() + "にち",
k: newSlots(),
r: rollRare()
});
}
return true;
}
function isCardList(a){
if(!Array.isArray(a)) return false;
for(var i = 0; i < a.length; i++){
if(!a[i] || typeof a[i] !== "object" || typeof a[i].n !== "number") return false;
}
return true;
}
function saveStamps(){
try{ window.localStorage.setItem("katakana_stamps", String(stampCount)); }catch(e){}
try{ window.localStorage.setItem("katakana_cards", JSON.stringify(cards)); }catch(e){}
try{ window.localStorage.setItem("katakana_slots", JSON.stringify(slots)); }catch(e){}
}
var bookPage = -1;
function drawStamps(freshIndex){
var box = $("stamps");
if(!box) return;
box.innerHTML = "";
var lastPage = cards.length;
var page = (bookPage < 0 || bookPage > lastPage) ? lastPage : bookPage;
var done = (page < cards.length);
var ks = done ? (cards[page].k || slots) : slots;
var filled = done ? PER_CARD : (stampCount % PER_CARD);
var isRare = done && cards[page].r;
var panel = $("stampBook");
if(panel) panel.className = "bookcard" + (isRare ? " rare" : "");
for(var i = 0; i < PER_CARD; i++){
var got = (i < filled);
var s = document.createElement(got ? "button" : "div");
s.className = "stamp";
if(got){
s.className += " got";
var st = STAMPS[ks[i]] || STAMPS[0];
s.innerHTML = stampHTML(st);
if(!done && i === freshIndex) s.className += " fresh";
s.setAttribute("aria-label", st.n + "を 大きく みる");
(function(st){
s.addEventListener("click", function(){ zoomStamp(st); });
})(st);
} else {
s.textContent = "";
}
box.appendChild(s);
}
$("bookNum").textContent = stampCount;
var nav = $("bookNav");
if(nav){
$("pageLabel").textContent = done
? (page + 1) + "まいめ（かんせい）"
: (lastPage + 1) + "まいめを あつめちゅう";
$("prevPage").disabled = (page === 0);
$("nextPage").disabled = (page === lastPage);
nav.style.display = (lastPage === 0) ? "none" : "flex";
}
var left = PER_CARD - filled;
if(done){
$("bookNext").innerHTML = '<span class="bignext">🎉</span><br>' + cards[page].date + ' に かんせい！';
} else {
$("bookNext").innerHTML = (left === 0)
? '<span class="bignext">🎉</span><br>カード ぜんぶ うまった！'
: '<span class="bignext">' + stampHTML(slotStamp(filled)) + '</span><br>つぎは ' + slotStamp(filled).n + '（あと ' + left + 'こ）';
}
}
function turnPage(d){
var lastPage = cards.length;
var page = (bookPage < 0 || bookPage > lastPage) ? lastPage : bookPage;
page += d;
if(page < 0) page = 0;
if(page > lastPage) page = lastPage;
bookPage = page;
audio();
tone(880, 0, 0.1);
drawStamps(-1);
}
function stampPop(st){
var el = document.createElement("div");
el.className = "stamppop";
el.innerHTML = stampHTML(st);
document.body.appendChild(el);
setTimeout(function(){
if(el.parentNode) el.parentNode.removeChild(el);
}, 1600);
}
function addStamp(){
if(!slots.length) slots = newSlots();
var idx = stampCount % PER_CARD;
var st = slotStamp(idx);
stampCount++;
if(stampCount % PER_CARD === 0){
var d = new Date();
cards.push({
n: cards.length + 1,
date: d.getFullYear() + "ねん " + (d.getMonth() + 1) + "がつ " + d.getDate() + "にち",
k: slots.slice(),
r: rollRare()
});
cardDone = cards.length;
slots = newSlots();
}
saveStamps();
bookPage = -1;
drawStamps(idx);
return st;
}

function vehicleSound(type, delay){

if(type === "steam"){

for(var i = 0; i < 4; i++) puffNoise(d + 1.2 + i * 0.28);
} else if(type === "shinkansen"){
sweep(400, 1600, d, 0.9, 0.14);
sweep(1600, 300, d + 0.9, 0.7, 0.10);
} else if(type === "express"){
twoTone(1200, 1000, d, 0.7, "square", 0.10);
} else if(type === "train"){
for(var i = 0; i < 5; i++) clackOnce(d + i * 0.3);
} else if(type === "metro"){
rumble(d, 1.4);
} else if(type === "tram"){
bell(d); bell(d + 0.35);
} else if(type === "mono"){
sweep(700, 1100, d, 1.2, 0.09);
} else if(type === "bus"){
hiss(d, 0.6);
rumble(d + 0.55, 0.8);
} else if(type === "siren"){
for(var i = 0; i < 2; i++){
tone(960, d + i * 1.0, 0.45);
tone(770, d + i * 1.0 + 0.48, 0.45);
}
} else if(type === "fire"){
sweep(500, 900, d, 0.55, 0.16);
sweep(900, 500, d + 0.55, 0.55, 0.16);
sweep(500, 900, d + 1.1, 0.55, 0.16);
} else if(type === "police"){
sweep(700, 1400, d, 0.8, 0.13);
sweep(1400, 700, d + 0.8, 0.8, 0.13);
} else if(type === "car"){
twoTone(440, 370, d, 0.5, "sawtooth", 0.13);
} else if(type === "station"){
tone(1318.5, d, 0.3);
tone(1046.5, d + 0.16, 0.5);
} else if(type === "engine"){
for(var i = 0; i < 10; i++) thud(d + i * 0.13);

} else if(type === "crane"){

} else if(type === "beep"){

} else if(type === "race"){

sweep(900, 200, d + 0.7, 0.8, 0.12);
} else if(type === "bike"){
for(var i = 0; i < 14; i++) thud(d + i * 0.075);
} else if(type === "bicycle"){
bell(d); bell(d + 0.22);
} else if(type === "jet"){
hiss(d, 1.6);
sweep(300, 700, d, 1.6, 0.09);
} else if(type === "heli"){
for(var i = 0; i < 16; i++) thud(d + i * 0.09);
} else if(type === "ship"){
twoTone(130, 98, d, 1.6, "sawtooth", 0.14);
} else if(type === "rocket"){
rumble(d, 2.0);
sweep(120, 1400, d + 0.4, 1.8, 0.12);
hiss(d + 0.6, 1.4);
}
}
function twoTone(f1, f2, t, len, wave, vol){
var a = audio(); if(!a) return;
try{
[f1, f2].forEach(function(f){
var o = a.createOscillator(), g = a.createGain();
o.type = wave || "triangle";
o.frequency.setValueAtTime(f, a.currentTime + t);
g.gain.setValueAtTime(0, a.currentTime + t);
g.gain.linearRampToValueAtTime(vol, a.currentTime + t + 0.08);
g.gain.setValueAtTime(vol, a.currentTime + t + len * 0.7);
g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t + len);
o.connect(g); g.connect(master(a));
o.start(a.currentTime + t); o.stop(a.currentTime + t + len + 0.05);
});
}catch(e){}
}
function sweep(from, to, t, len, vol){
var a = audio(); if(!a) return;
try{
var o = a.createOscillator(), g = a.createGain();
o.type = "triangle";
var s = a.currentTime + t;
o.frequency.setValueAtTime(from, s);
o.frequency.exponentialRampToValueAtTime(Math.max(20, to), s + len);
g.gain.setValueAtTime(0, s);
g.gain.linearRampToValueAtTime(vol, s + 0.06);
g.gain.exponentialRampToValueAtTime(0.0001, s + len);
o.connect(g); g.connect(master(a));
o.start(s); o.stop(s + len + 0.05);
}catch(e){}
}
function rumble(t, len){
var a = audio(); if(!a) return;
try{
var s = a.currentTime + t;
var n = Math.ceil(a.sampleRate * len);
var b = a.createBuffer(1, n, a.sampleRate);
var d = b.getChannelData(0);
for(var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * 0.6;
var src = a.createBufferSource(); src.buffer = b;
var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 180;
var g = a.createGain();
g.gain.setValueAtTime(0, s);
g.gain.linearRampToValueAtTime(0.30, s + 0.1);
g.gain.setValueAtTime(0.30, s + len * 0.7);
g.gain.linearRampToValueAtTime(0.0001, s + len);
src.connect(lp); lp.connect(g); g.connect(master(a));
src.start(s);
}catch(e){}
}
function hiss(t, len){
var a = audio(); if(!a) return;
try{
var s = a.currentTime + t;
var n = Math.ceil(a.sampleRate * len);
var b = a.createBuffer(1, n, a.sampleRate);
var d = b.getChannelData(0);
for(var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
var src = a.createBufferSource(); src.buffer = b;
var hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
var g = a.createGain(); g.gain.value = 0.16;
src.connect(hp); hp.connect(g); g.connect(master(a));
src.start(s);
}catch(e){}
}
function bell(t){
var a = audio(); if(!a) return;
try{
var s = a.currentTime + t;
[1800, 2400].forEach(function(f, k){
var o = a.createOscillator(), g = a.createGain();
o.type = "sine"; o.frequency.value = f;
g.gain.setValueAtTime(k ? 0.06 : 0.12, s);
g.gain.exponentialRampToValueAtTime(0.0001, s + 0.28);
o.connect(g); g.connect(master(a));
o.start(s); o.stop(s + 0.3);
});
}catch(e){}
}
function puffNoise(t){
var a = audio(); if(!a) return;
try{
var s = a.currentTime + t;
var n = Math.ceil(a.sampleRate * 0.14);
var b = a.createBuffer(1, n, a.sampleRate);
var d = b.getChannelData(0);
for(var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
var src = a.createBufferSource(); src.buffer = b;
var bp = a.createBiquadFilter(); bp.type = "bandpass";
bp.frequency.value = 900; bp.Q.value = 0.8;
var g = a.createGain(); g.gain.value = 0.20;
src.connect(bp); bp.connect(g); g.connect(master(a));
src.start(s);
}catch(e){}
}
function clackOnce(t){
var a = audio(); if(!a) return;
try{
[0, 0.11].forEach(function(off){
var s = a.currentTime + t + off;
var o = a.createOscillator(), g = a.createGain();
o.type = "square"; o.frequency.setValueAtTime(90, s);
g.gain.setValueAtTime(0.09, s);
g.gain.exponentialRampToValueAtTime(0.0001, s + 0.07);
o.connect(g); g.connect(master(a));
o.start(s); o.stop(s + 0.08);
});
}catch(e){}
}

function saveCanvas(cv, name){
try{
if(cv.toBlob && navigator.canShare){
cv.toBlob(function(blob){
if(!blob) return;
var file = new File([blob], name, { type: "image/png" });
if(navigator.canShare({ files: [file] })){
navigator.share({ files: [file] }).catch(function(){ dlCanvas(cv, name); });
} else {
dlCanvas(cv, name);
}
}, "image/png");
return;
}
}catch(e){}
dlCanvas(cv, name);
}
function dlCanvas(cv, name){
try{
var url = cv.toDataURL("image/png");
var a = document.createElement("a");
a.href = url;
a.download = name;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}catch(e){
window.alert("がぞうを ながおし して ほぞん して ください");
}
}
function drawCardCanvas(c){

var cv = document.createElement("canvas");
cv.width = W; cv.height = H;
cv.className = "cardimg";
var x = cv.getContext("2d");
if(!x) return null;

var nextTimer = null;
var afterFn = null;
function scheduleAfter(fn, ms){
if(nextTimer) clearTimeout(nextTimer);
afterFn = fn;
nextTimer = setTimeout(function(){
nextTimer = null;
var f = afterFn; afterFn = null;
if(f) f();
}, ms);
}
function scheduleNext(ms){
scheduleAfter(next, ms);
}

function maxLen(){
if(stampCount < 10) return 2;
if(stampCount < 30) return 3;
if(stampCount < 60) return 4;
return 99;
}
function choiceCount(){
return (stampCount < 10) ? 3 : 6;
}
var recentWords = [];
function pickWord(){
var lim = maxLen();
var pool = WORDS.filter(function(w){ return w[1].length <= lim; });
if(!pool.length) pool = WORDS;
var fresh = pool.filter(function(w){ return recentWords.indexOf(w[1]) === -1; });
var item = pick(fresh.length ? fresh : pool);
recentWords.push(item[1]);
var keep = Math.min(12, Math.floor(pool.length / 2));
while(recentWords.length > keep) recentWords.shift();
return item;
}

btn.classList.add("used");
btn.disabled = true;
var ng = practice ? "ひかってる じを おしてみてね"
: ((misses >= 2) ? "ここだよ、おしてみてね" : "だいじょうぶ、ヒント だすね");
$("toast").textContent = ng;
sayLines([
{ t:READ[k] || k, at:780,  rate:0.8, pitch:1.2 },
{ t:ng,           at:1500, rate:0.95, pitch:1.35 }
]);
drawSlots();
if(misses >= 2) glowAnswer(answer);
}
}
function glowAnswer(answer){
var bs = $("choices").children;
for(var i = 0; i < bs.length; i++){
if(bs[i].textContent === answer){
bs[i].classList.add("glow");
break;
}
}
}
function setMode(p){
if(practice === p) return;
practice = p;
$("modeQuiz").className = p ? "mode" : "mode on";
$("modePractice").className = p ? "mode on" : "mode";
document.body.classList.toggle("practice", p);
$("score").parentNode.style.display = p ? "none" : "";
$("streak").style.display = p ? "none" : "";
audio();
tone(880, 0, 0.12);
var pending = afterFn;
sayLines(
[{ t: p ? "れんしゅう しようね" : "もんだい、やってみよう", at:150, rate:0.9, pitch:1.35 }],
function(){
if(pending) scheduleAfter(pending, 350);
else scheduleNext(350);
}
);
}
$("modeQuiz").addEventListener("click", function(){ setMode(false); });
$("modePractice").addEventListener("click", function(){ setMode(true); });
function goTab(name){
audio();
var ts = document.querySelectorAll(".tab");
for(var j = 0; j < ts.length; j++){
ts[j].classList.toggle("on", ts[j].getAttribute("data-p") === name);
}
var ps = document.querySelectorAll(".panel");
for(var j = 0; j < ps.length; j++) ps[j].classList.remove("on");
$("p-" + name).classList.add("on");
if(name !== "game" && nextTimer){ clearTimeout(nextTimer); nextTimer = null; }
document.body.classList.toggle("practice", practice && name === "game");
bgmUpdate();
wakeUpdate();
tone(880, 0, 0.12);
if(name === "table"){
sayLines([
{ t:"アイウエオ ひょう だよ", at:180, rate:0.85, pitch:1.35 }
]);
} else if(name === "book"){
drawStamps(-1);
drawCards();
sayLines([
{ t:"スタンプちょう だよ。いま " + stampCount + "こ あつめたね", at:180, rate:0.85, pitch:1.35 }
]);
} else {
var fresh = (!word || step >= word.length);
var pending = nextTimer ? null : afterFn;
var then = null;
if(pending) then = function(){ scheduleAfter(pending, 350); };
else if(nextTimer) then = null;
else if(fresh) then = function(){ scheduleNext(350); };
else then = function(){ sayWord(word, 150); };
sayLines(
[{ t:"さあ、ゲーム はじめよう", at:180, rate:0.9, pitch:1.4 }],
then
);
}
}
var tabs = document.querySelectorAll(".tab");
for(var i = 0; i < tabs.length; i++){
tabs[i].addEventListener("click", function(){
goTab(this.getAttribute("data-p"));
});
}
$("printBtn").addEventListener("click", printCards);
$("prevPage").addEventListener("click", function(){ turnPage(-1); });
$("nextPage").addEventListener("click", function(){ turnPage(1); });
$("imgBtn").addEventListener("click", function(){ if(cards.length) imageCards(); });
$("exportBtn").addEventListener("click", exportStamps);
$("addBtn").addEventListener("click", function(){
var s = window.prompt("スタンプを なんこ おしますか？（1〜20）", "1");
if(s === null) return;
var n = parseInt(s, 10);
if(isNaN(n) || n < 1) return;
if(n > 20) n = 20;
var last = null;
for(var i = 0; i < n; i++) last = addStamp();
drawCards();
audio();
if(cardDone){
var cn = cardDone; cardDone = 0;
cardCelebrate(cn, null);
} else {
dingdong();
if(last) stampPop(last);
}
});
$("delBtn").addEventListener("click", function(){
if(!stampCount){ window.alert("スタンプが ありません"); return; }
var s = window.prompt("スタンプを なんこ へらしますか？（いま " + stampCount + "こ）", "1");
if(s === null) return;
var n = parseInt(s, 10);
if(isNaN(n) || n < 1) return;
if(n > stampCount) n = stampCount;
var after = stampCount - n;
var should = Math.floor(after / PER_CARD);
var lose = cards.length - should;
if(lose > 0){
if(!window.confirm("カードが " + lose + "まい なくなります。よろしいですか？")) return;
}
stampCount = after;
if(cards.length > should) cards = cards.slice(0, should);
cardDone = 0;
saveStamps();
drawStamps(-1);
drawCards();
audio();
buzz();
});
$("resetBtn").addEventListener("click", function(){
if(!stampCount && !cards.length){ return; }
if(!window.confirm("スタンプ " + stampCount + "こと カード " + cards.length + "まいを ぜんぶ 消します。よろしいですか？")) return;
if(!window.confirm("ほんとうに 消しますか？ もとに もどせません。")) return;
stampCount = 0;
cards = [];
cardDone = 0;
saveStamps();
drawStamps(-1);
drawCards();
});
loadStamps();
drawStamps(-1);
drawCards();
if(speechDead){
speechWarned = true;
$("novoice").style.display = "block";
}
// アプリを開いたときのあいさつ（ブラウザは最初にさわるまで声を出せないので、「はじめる」を押したら話す）
var WELCOME = ["きょうも いっしょに がんばろうね", "きょうも カタカナ やってみようね", "あえて うれしいな。きょうも がんばろうね"];
(function(){
var h = new Date().getHours();
var hello = (h >= 5 && h < 10) ? "おはよう！" : (h >= 10 && h < 17) ? "こんにちは！" : "こんばんは！";
var line = pick(WELCOME);
var st = stampCount ? "スタンプ、いま " + stampCount + "こ あつまってるよ" : "";
$("wTitle").textContent = hello;
$("wSub").innerHTML = line + (stampCount ? "<br>🎫 スタンプ " + stampCount + "こ あつまってるよ" : "");
var box = $("welcome");
box.addEventListener("click", function(){
if(box.classList.contains("off")) return;
box.classList.add("off");
audio();
tone(880, 0, 0.12);
var lines = [
{ t:hello, at:250,  rate:0.95, pitch:1.4 },
{ t:line,  at:1200, rate:0.9,  pitch:1.35 }
];
if(st) lines.push({ t:st, at:3600, rate:0.9, pitch:1.35 });
sayLines(lines);
});
})();
</script>
